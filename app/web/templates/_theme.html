{# Light / dark theme (dark by default). Included in the <head> of layout.html and login.html.
   Pages are styled with the light iOS classes; in dark mode the rules below lay the iOS dark palette
   over them. Regenerate the palette block if new colour classes are introduced. #}
<script>
    (function () {
        var t = localStorage.getItem('inew-theme') || 'dark';
        if (t === 'dark') document.documentElement.classList.add('dark');
    })();
    function inewToggleTheme() {
        var dark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('inew-theme', dark ? 'dark' : 'light');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#000000' : '#F2F2F7');
    }
    document.addEventListener('DOMContentLoaded', function () {
        var m = document.querySelector('meta[name="theme-color"]');
        if (m && document.documentElement.classList.contains('dark')) m.setAttribute('content', '#000000');
    });
</script>
