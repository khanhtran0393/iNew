<!DOCTYPE html>
<html lang="vi" class="h-full bg-[#F2F2F7] text-[#1C1C1E]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F2F2F7">
    <title>Đăng nhập — iNew</title>
    <link rel="icon" type="image/png" href="/static/img/favicon-32.png">
    <link rel="stylesheet" href="/static/css/app.css?v={{ app_version }}">
    <style>body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }</style>
    {% include '_theme.html' %}
</head>
<body class="h-full flex items-center justify-center p-4 bg-[#F2F2F7]">
    <div class="fixed top-4 right-4">
        <button type="button" onclick="inewToggleTheme()" title="Đổi giao diện Sáng / Tối" aria-label="Đổi giao diện Sáng / Tối" class="text-[13px] bg-[#EFEFF4] hover:bg-[#E5E5EA] text-[#3C3C43] h-9 w-9 rounded-[10px] inline-flex items-center justify-center transition">
            <svg class="theme-icon-moon w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
            <svg class="theme-icon-sun w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
    </div>
    <div class="w-full max-w-md bg-white border border-[#ECECEE] p-8 rounded-2xl shadow-2xl relative overflow-hidden">
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <div class="text-center mb-8">
            <img src="/static/img/icon-256.png" alt="iNew" class="inline-block h-16 w-16 rounded-[16px] shadow-lg shadow-blue-500/30 mb-3">
            <h1 class="text-2xl font-bold text-[#1C1C1E] tracking-tight">iNew</h1>
            <p class="text-sm text-[#8A8A8E] mt-1">Hệ Thống Thu Thập & Biên Tập Tin Tức</p>
        </div>

        {% if error %}
        <div class="mb-5 p-3 rounded-xl bg-red-50 border border-red-700/50 text-red-700 text-sm flex items-center space-x-2">
            <svg class="w-5 h-5 flex-shrink-0 text-red-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/auth/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-[#3C3C43] uppercase tracking-wider mb-1.5">Tên đăng nhập</label>
                <input type="text" name="username" required autofocus placeholder="admin"
                    class="w-full px-4 py-2.5 rounded-xl bg-[#EFEFF4] border border-[#D9D9DE] text-[#1C1C1E] placeholder-[#AEAEB2] focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm transition">
            </div>
            <div>
                <label class="block text-xs font-semibold text-[#3C3C43] uppercase tracking-wider mb-1.5">Mật khẩu</label>
                <input type="password" name="password" required placeholder="••••••••"
                    class="w-full px-4 py-2.5 rounded-xl bg-[#EFEFF4] border border-[#D9D9DE] text-[#1C1C1E] placeholder-[#AEAEB2] focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm transition">
            </div>
            <button type="submit"
                class="w-full py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm shadow-lg shadow-blue-600/30 transition transform active:scale-[0.99] mt-2">
                Đăng nhập hệ thống
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-[#AEAEB2]">
            Hệ thống quản trị nội bộ bảo mật 24/7
        </div>
    </div>
</body>
</html>
